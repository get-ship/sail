[package]
name = "xtask-deck"
version = "0.1.0"
edition = "2024"
publish = false
description = "Bakes the lucide SVG set into sail's deck-core assets. The output is committed source the deck-bundler loads at compile time and the daemon reads at runtime to serve /_deck/icons/{name}.svg."

[[bin]]
name = "xtask-deck"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde_json = "1"
[lints.clippy]
all = { level = "warn", priority = -1 }
