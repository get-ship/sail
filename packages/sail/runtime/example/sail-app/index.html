<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SAIL sanity-check</title>
  <style>
    :root {
      --bg: #0c0d10;
      --fg: #e6e6e6;
      --muted: #8a8c92;
      --border: #232529;
      --card: #14161a;
      --primary: #7aa2f7;
      --success: #9ece6a;
      --warning: #e0af68;
      --danger: #f7768e;
      --accent: #bb9af7;
      --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #fafafa; --fg: #1a1a1c; --muted: #6a6c72; --border: #e2e3e6;
        --card: #ffffff; --primary: #335cca; --success: #2e8050; --warning: #8a5a0c;
        --danger: #c43c5a; --accent: #6c45c5;
      }
    }
    body {
      margin: 0; font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg); color: var(--fg); min-height: 100vh;
    }
    h1 { font-size: 1.5rem; margin: 0; }
    h2 { font-size: 0.75rem; margin: 0 0 8px; text-transform: uppercase;
         letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }
    .wrap { max-width: 64rem; margin: 0 auto; padding: 24px 16px; }
    header { display: flex; align-items: baseline; justify-content: space-between;
             padding-bottom: 16px; border-bottom: 1px solid var(--border); margin-bottom: 24px; }
    header p { margin: 0; font-size: 0.875rem; color: var(--muted); }
    section { margin: 24px 0; }
    button {
      background: transparent; color: inherit;
      border: 1px solid var(--border); padding: 4px 10px;
      border-radius: 6px; font: inherit; font-size: 0.875rem;
      cursor: pointer;
    }
    button:hover { border-color: var(--primary); }
    button.primary { background: var(--primary); color: var(--bg); border-color: var(--primary); }
    button.danger { color: var(--danger); border-color: color-mix(in oklch, var(--danger) 50%, transparent); }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .stat { font-family: var(--mono); font-size: 0.75rem; color: var(--muted); }
    .cols { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    @media (max-width: 800px) { .cols { grid-template-columns: 1fr; } }
    .col {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 10px; padding: 12px; min-height: 100px;
    }
    .col-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px;
                font-size: 0.875rem; font-weight: 600; }
    .dot { width: 8px; height: 8px; border-radius: 50%; }
    .cards { display: flex; flex-direction: column; gap: 8px; list-style: none; margin: 0; padding: 0; }
    .card {
      background: var(--bg); border: 1px solid var(--border);
      border-left: 3px solid var(--border);
      border-radius: 6px; padding: 10px 12px; cursor: grab;
      transition: transform 120ms ease, border-color 120ms ease;
    }
    .card:hover { border-color: color-mix(in oklch, var(--primary) 40%, var(--border)); }
    .card:active { cursor: grabbing; }
    .card .title { font-size: 0.875rem; font-weight: 600; margin-bottom: 4px; }
    .card .meta { font-size: 0.75rem; color: var(--muted); font-family: var(--mono); }
    .pill { display: inline-block; padding: 1px 6px; border-radius: 999px;
            font-size: 0.625rem; font-family: var(--mono); margin-left: 4px; }
    .pill.high { background: color-mix(in oklch, var(--danger) 18%, transparent); color: var(--danger); }
    .pill.low { background: color-mix(in oklch, var(--muted) 18%, transparent); color: var(--muted); }
    .counter {
      display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px;
      background: var(--card); border: 1px solid var(--border); border-radius: 8px;
      font-family: var(--mono);
    }
    .counter strong { font-size: 1.25rem; }
    .ticks {
      font-family: var(--mono); font-size: 0.75rem; color: var(--muted);
      padding: 8px 12px; background: var(--card); border: 1px solid var(--border); border-radius: 8px;
      max-height: 120px; overflow-y: auto;
    }
    .ticks-row { padding: 1px 0; }
    .ticks-row.fresh { color: var(--success); }
    .ticks-row.warn { color: var(--warning); }
  </style>
</head>
<body>
  <sail-app></sail-app>
  <script type="module" src="./dist/main.js"></script>
</body>
</html>
