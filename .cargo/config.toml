# Workspace cargo config.
#
# Every cargo invocation resolves `target-dir` to the workspace's own
# `target/`. Per-user overrides go in `.cargo/config.local.toml` (gitignored);
# cargo loads both and merges, with the local file winning on conflict.

[build]
target-dir = "target"

# Repo automation entry point — `cargo xtask <cmd>` (see xtask/ crate).
# User-facing toolchain is the `sail` binary from deck-cli.
[alias]
xtask = "run -p xtask --"
