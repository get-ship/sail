# Hygiene + type-gate suites.
# Parity (taffy/takumi vs browser) stays in parity.yml — do not merge the two.
# App corpus builds (`sail-compiler build apps/studio|sail-site`) are in
# type-gate. The Pure-law leftovers that used to keep them out (studio
# globalThis.fetch, sail-site _legacy rAF) are gone. Do not
# continue-on-error a red corpus step.

name: hygiene

on:
  push:
    branches: [main, feat/next, 'job/**']
  pull_request:
    branches: [main, feat/next, 'job/**']

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTC_WRAPPER: ''

jobs:
  hygiene:
    name: hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install JS deps
        run: bun install --frozen-lockfile || bun install

      - name: Hygiene suite
        run: bun test tests/hygiene

  type-gate:
    name: type-gate suites
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: hygiene-sail-compiler

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install JS deps
        run: bun install --frozen-lockfile || bun install

      - name: Type-gate suites
        run: |
          cargo test -p sail-compiler --test type_gate_e1 --test type_env_per_kind \
            --test ambient_table_complete --test ambient_app_tsc --test ambient_corpus_s5_2
          cargo test -p sail-compiler --lib pack_declares
          cargo test -p sail-compiler --lib rejects_settimeout

      - name: App corpus builds
        env:
          SAIL_COMPILER_NO_LIMITS: "1"
        run: |
          cargo run -p sail-compiler --quiet -- build apps/sail-site/src
          cargo run -p sail-compiler --quiet -- build apps/studio/src
