# Helix — this checkout. Highlight = tree-sitter-sail; intelligence = sail lsp.
# One-time: `bun run helix-setup` in packages/sail/grammar (builds the
# grammar + links queries into ~/.config/helix/runtime/queries/sail).

[language-server.sail]
command = "sail"
args = ["lsp"]

[[language]]
name = "sail"
scope = "source.sail"
file-types = ["sail"]
comment-token = "<!--"
indent = { tab-width = 2, unit = "  " }
roots = ["sail.config.jsonc", "sail.config.json"]
language-servers = ["sail"]
grammar = "sail"

# Grammar *source* is not here — Helix needs an absolute path to build.
# `bun run helix-setup` in packages/sail/grammar writes that into
# ~/.config/helix/languages.toml.
