[package]
name = "sui-signals"
version = "0.1.0"
edition = "2024"
publish = false
description = "Fine-grained reactive signals with Send+Sync semantics for the tokio daemon"

[lints]
workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "notify"
harness = false
