<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Daemon mode — rewritten by `inject_mode_meta` to reflect the running
       daemon. The live-reload client self-gates on content="development". -->
  <meta name="deck-mode" content="development" />
  <title>SUI View</title>

  <!-- Design tokens (always-on for SUI components). -->
  <link rel="stylesheet" href="/api/assets/view-tokens.css" />

  <!-- Runtime imports.  All SUI hosts share this importmap shape; if you
       host SUI views from another web app, copy this block. -->
  <script type="importmap">
    {
      "imports": {
        "@ship/sui-runtime":                "/_deck/runtime.js",
        "@ship/sui-runtime/route":          "/_deck/runtime.js",
        "@ship/sui-runtime/template-hooks": "/_deck/runtime.js",
        "@ship/sui-dom":                    "/_deck/dom.js",
        "@ship/sdk-client":                 "/_deck/sdk-client.js"
      }
    }
  </script>

  <style>
    html, body { height: 100%; margin: 0; padding: 0; background: var(--background, #fff); }
    #sui-root { height: 100vh; display: flex; flex-direction: column; }
    .view-host-error {
      padding: 2rem; font-family: var(--font-mono, monospace);
      color: var(--destructive-foreground, #fff);
      background: var(--destructive, #c33);
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <!-- `data-sui-root` + `data-view` scope the mount root: the runtime's
       patch-elements applier queries `[data-sui-root][data-view="<name>"]`
       so out-of-band DOM patches can't escape the hosted view, and the
       SSR markup advertises which view it is. The daemon fills the name
       from the URL path (empty for the bare `/_deck/view` landing). -->
  <div id="sui-root" data-sui-root data-view="<!-- SUI_VIEW_NAME -->"><!-- SUI_SSR_CONTENT --></div>

  <!-- Mount script. The hosted view's name comes from the URL path
       segments after the host prefix (e.g. `/_deck/view/ship-ui-studio/sui-button`
       → name = "ship-ui-studio/sui-button"). The runtime fetches
       /_deck/views/<that> and mounts the payload here. -->
  <script type="module">
    import { mount, attachBoundary } from '@ship/sui-runtime'

    function viewPathFromLocation() {
      const path = location.pathname
      // Strip the host prefix `/_deck/view/` — the daemon mounts this shell at
      // `/_deck/view/<name>[/<sub>]` (the single-view host route). The prefix is
      // two segments, so match it explicitly rather than dropping one segment.
      const m = path.match(/^\/_deck\/view\/(.*)$/)
      return m ? m[1] : ''
    }

    const target = document.getElementById('sui-root')
    const viewPath = viewPathFromLocation()

    // Default error boundary — deck installs ONE at the view-host root so a
    // runtime throw the author never wrapped (a re-run effect, a bindFor/bindIf
    // render, a child component's mount) surfaces HERE instead of vanishing into
    // console.error. The runtime's runProtected/findNearestBoundary walks up to
    // this handle whenever no nearer <sui-error-boundary> exists (inv-deck-no-
    // silent-errors). Dev shows the real message + source + stack; prod degrades
    // to a safe generic message. textContent (not innerHTML) — never inject the
    // error text as markup.
    const isDev =
      (document.querySelector('meta[name="deck-mode"]')?.getAttribute('content') ?? '') === 'development'
    let __boundaryFired = false
    attachBoundary(target, {
      catch(err, source) {
        if (__boundaryFired) return // first error wins; ignore cascades
        __boundaryFired = true
        const e = err instanceof Error ? err : new Error(String(err))
        const panel = document.createElement('div')
        panel.className = 'view-host-error'
        panel.textContent = isDev
          ? 'Runtime error (' + source + '): ' + e.message + '\n\n' + (e.stack || '')
          : 'Something went wrong rendering this view.'
        target.replaceChildren(panel)
      },
      reset() { __boundaryFired = false; location.reload() },
    })

    if (!viewPath) {
      target.innerHTML =
        '<div class="view-host-error">No view in URL.\n\n' +
        'Use /_deck/view/&lt;name&gt;[/&lt;sub&gt;] — e.g. /_deck/view/ship-ui-studio.</div>'
    } else {
      try {
        const res = await fetch(`/_deck/views/${viewPath}`, { credentials: 'same-origin' })
        if (!res.ok) {
          // The daemon serves a styled HTML 404 for a missing top-level view
          // before this shell ever boots, so this branch only fires for
          // sub-route / transient failures. Show a clean inline message —
          // never dump the payload endpoint's raw JSON error body.
          const reason = res.status === 404 ? 'View not found' : `Request failed (${res.status})`
          target.innerHTML =
            '<div class="view-host-error">' + reason + ': ' + viewPath + '</div>'
        } else {
          const payload = await res.json()
          // Build a same-origin SDK client so view controllers that use
          // `({ ship })` can fire daemon mutations (stage / commit / push
          // / ...). Without this, controllers that destructure `ship` see
          // `undefined` and any `ship.<domain>.<op>(...)` call throws.
          let ship
          try {
            const sdk = await import('@ship/sdk-client')
            ship = sdk.createClient()
          } catch {
            // SDK not available — leave ship undefined; read-only views
            // that rely solely on `<data live />` keep working.
            ship = undefined
          }
          // Host loader: the SUI runtime is URL-scheme-agnostic, so the
          // view-host supplies how to fetch payloads.
          // (Keeps `/_deck/...` at the host boundary, not in mount().)
          const loader = {
            fetchView: async (nameOrPath) => {
              const path = nameOrPath.startsWith('/_deck/views/') ? nameOrPath : `/_deck/views/${nameOrPath}`
              const r = await fetch(path, { credentials: 'same-origin' })
              if (!r.ok) throw new Error(`fetch ${path} ${r.status}`)
              return r.json()
            },
          }
          // Keyed clients map — the injection surface for the view's
          // declared `<client name="…" />` directives. Deck hosts have ONE
          // same-origin data client, so every name the payload declares is
          // bound to it: the name is the view's alias for the host's data
          // surface, not a router to distinct backends (a host with several
          // real clients builds a richer map). `ship` stays present as the
          // ambient-default compatibility key for undeclared views.
          const clients = {
            ship,
            ...Object.fromEntries((payload.clients ?? []).map((n) => [n, ship])),
          }
          // mount() morphs onto the SSR markup already inside #sui-root
          // (seeded by the daemon, including the __set_init__ island),
          // then returns a handle. Expose its disposer as
          // window.__suiDispose — hosts and e2e probes treat that
          // property as the "attach complete" signal.
          const handle = await mount(target, payload, { ship, clients, loader })
          window.__suiDispose = () => handle.dispose()

          // Live-reload: in development the daemon's bundler rebuilds this
          // view on save and emits an SSE event. The Deck live-reload client
          // (self-gated on the deck-mode meta) re-fetches the payload and
          // re-mounts in place via the handle — signal state is preserved.
          try {
            const { attachLiveReload } = await import('/_deck/live-reload.js')
            const reloader = attachLiveReload({
              viewName: viewPath.split('/')[0],
              onViewChanged: async (e) => {
                const fresh = await loader.fetchView(viewPath)
                if (e && e.bytes != null && fresh && fresh.moduleUrl) {
                  const sep = fresh.moduleUrl.includes('?') ? '&' : '?'
                  fresh.moduleUrl = `${fresh.moduleUrl}${sep}v=${e.bytes}`
                }
                await handle.reload(fresh)
              },
            })
            const prevDispose = window.__suiDispose
            window.__suiDispose = () => { reloader.close(); prevDispose() }
          } catch (err) {
            console.warn('[live-reload] unavailable:', err && err.message ? err.message : err)
          }
        }
      } catch (err) {
        target.innerHTML =
          `<div class="view-host-error">Mount failed: ${err && err.message ? err.message : err}</div>`
      }
    }
  </script>
</body>
</html>
