[package]
name = "deck-core"
version = "0.1.0"
edition = "2024"
publish = false
description = "SAIL framework hosting logic — transport-agnostic. Produces DeckResponse; adapters (deck-axum, …) bind it to a server."

[lib]
name = "deck_core"
path = "src/lib.rs"
# Work around the Cargo cdylib/rlib filename collision described in
# crates/deck/deck/Cargo.toml. deck-core has no doctests, so disabling the
# doctest harness avoids the E0463/E0460 collision without losing coverage.
# See claim c-2026-07-19T18-12-45-685Z-f499ce4b.
doctest = false

[features]
default = []
specta = ["dep:specta", "deck-host/specta"]

[build-dependencies]
# The build script stages `<repo>/.deck/framework/*.js` → `assets/` for
# `include_str!`; it resolves that `.deck` dir through the SAME single constant
# the runtime/bundler use, so the staging path can never drift from the writer.
deck-config = { path = "../deck-config" }

[dependencies]
deck-config = { path = "../deck-config" }
deck-host = { path = "../deck-host" }
sail-compiler = { path = "../../sail/compiler" }

serde = { workspace = true }
serde_json = { workspace = true }
specta = { workspace = true, features = ["serde_json"], optional = true }

ulid = { workspace = true }

anyhow = { workspace = true }
tracing = { workspace = true }
notify = { workspace = true }
tempfile = "3"

[dev-dependencies]
deck-bundler = { path = "../deck-bundler" }
deck-config = { path = "../deck-config" }
tempfile = "3"
filetime = "0.2"
tokio = { workspace = true, features = ["test-util", "macros", "rt-multi-thread"] }
regex = { workspace = true }
[lints]
workspace = true
