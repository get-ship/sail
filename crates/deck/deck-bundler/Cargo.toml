[package]
name = "deck-bundler"
version = "0.1.0"
edition = "2024"
publish = false
description = "Deck's in-process Rolldown bundler (#163/#167) — compiles + bundles SAIL views/components/framework via a native Rust plugin that spawns sail-compiler in its load hook. The bundling half of the deck framework; serving is deck-core/deck-axum."

[lib]
name = "deck_bundler"
path = "src/lib.rs"

[dependencies]
deck-config = { path = "../deck-config" }

serde = { workspace = true }
serde_json = { workspace = true, features = ["preserve_order"] }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
notify = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "time", "sync", "macros"] }
rolldown = "1.0.3"
rolldown_common = "1.0.3"
# `module_types` on `BundlerOptions` takes `FxHashMap<String, ModuleType>`.
# Already in the lockfile (transitive via `rolldown_common`); pinned direct
# so the bundler can build the `{ ".css" -> Asset }` map without a wrapper.
rustc-hash = "2"

# glibc `malloc_trim` after each bundle returns the transient rolldown/oxc
# module-graph arenas to the OS (#256). Linux-only; on other targets the
# trim is a no-op (see `arena::trim_arenas`).
[target.'cfg(target_os = "linux")'.dependencies]
libc = { workspace = true }

[features]
# G3 bundle-parity regression gate (.artifacts/sail-arc/integrity/report.md §4).
# OFF by default so it never runs in `cargo test -p deck-bundler` / `just build`.
# The gate (`tests/bundle_parity.rs`) (1) builds every `all_targets()` target
# through the deck Rolldown path SEQUENTIALLY with a real exit check (Err
# propagates — unlike `build_all`, which swallows per-target errors), and
# (2) asserts the native `sail_compiler::compile` and the wasm `compile` export
# emit byte-identical `.js` over the compiler fixture corpus (the #160
# native-vs-wasm divergence class). Invoke explicitly:
#   cargo test -p deck-bundler --features g3 --test bundle_parity -- --nocapture
# (sail-compiler is now a non-optional dep — the bundler compiles in-process, #255 —
# so g3 only gates the wasm-parity test code, not the dependency.)
g3 = []

[dependencies.sail-compiler]
path = "../../sail/compiler"

[dependencies.deck-core]
path = "../deck-core"

[lints]
workspace = true
