[package]
name = "deck-cli"
version = "0.1.0"
edition = "2024"
publish = false
description = "The deck framework CLI — `deck build` (the next-build analog) over deck-bundler. deck is the framework; ship is an app built with it."

[[bin]]
name = "deck"
path = "src/main.rs"

[dependencies]
deck-bundler = { path = "../deck-bundler" }
deck-axum = { path = "../deck-axum" }
deck-core = { path = "../deck-core" }
deck-config = { path = "../deck-config" }
clap = { workspace = true }
anyhow = { workspace = true }
axum = { workspace = true, features = ["http1", "tokio"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["net", "rt", "rt-multi-thread", "signal", "sync", "macros", "time"] }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
# `deck dev` HMR: watch the project source, rebuild the SPA, push a reload.
notify = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
