[package]
name = "deck-cli"
version = "0.1.0"
edition = "2024"
publish = false
description = "Sail CLI (`sail`) and workspace bake (`deck-bake`)."

[[bin]]
name = "sail"
path = "src/main.rs"

[[bin]]
name = "deck-bake"
path = "src/bin/deck-bake.rs"

[dependencies]
deck-bundler = { path = "../deck-bundler" }
deck-axum = { path = "../deck-axum" }
deck-core = { path = "../deck-core" }
deck-config = { path = "../deck-config" }
# `sail dev` SSR: register the ship-js (V8) first-paint engine when an app opts
# into `render: ssr`. Pulled in lazily-at-runtime (only spun up for SSR apps).
deck-ssr = { path = "../deck-ssr" }
# In-process `tokens_generate` on theme JSON edits (same pipeline as
# `sail tokens` / production) — live path = DTCG → generate → HMR.
sail-compiler = { path = "../../sail/compiler" }
# Peer surfaces under one binary (C7): wrap existing crates, no second protocol.
sail-lsp = { path = "../../sail/lsp" }
sail-mcp = { path = "../../sail/mcp" }
sail-ops = { path = "../../sail/ops" }
sail-layout = { path = "../../sail/layout" }
sail-render = { path = "../../sail/render" }
# App-source floor for `sail check apps/*` — plain `apps/*/src/**/*.ts` modules.
sail-lint = { path = "../../sail/lint" }
clap = { workspace = true }
anyhow = { workspace = true }
axum = { workspace = true, features = ["http1", "tokio"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["net", "rt", "rt-multi-thread", "signal", "sync", "macros", "time"] }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
# `sail dev` HMR: watch the project source, rebuild the SPA, push a reload.
notify = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
