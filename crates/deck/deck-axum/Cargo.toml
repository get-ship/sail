[package]
name = "deck-axum"
version = "0.1.0"
edition = "2024"
publish = false
description = "Axum adapter for deck-core — maps DeckResponse onto axum responses and registers deck's hosting surface as a mountable router."

[lib]
name = "deck_axum"
path = "src/lib.rs"
# Work around the Cargo cdylib/rlib filename collision described in
# crates/deck/deck/Cargo.toml. deck-axum has no doctests, so disabling the
# doctest harness avoids the E0463/E0460 collision without losing coverage.
# See claim c-2026-07-19T18-12-45-685Z-f499ce4b.
doctest = false

[features]
default = []
specta = ["dep:specta", "deck-core/specta"]

[dependencies]
deck-config = { path = "../deck-config" }
deck-core = { path = "../deck-core" }
deck-bundler = { path = "../deck-bundler" }
# Policy registry payload (SPEC-POLICY-1) — shared serialization with CLI/MCP.
sail-compiler = { path = "../../sail/compiler" }

axum = { workspace = true, features = ["http1", "tokio", "ws"] }
futures-util = { workspace = true }
tokio = { workspace = true, features = ["sync", "time", "rt", "macros"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
ulid = { workspace = true }
async-stream = "0.3"
specta = { workspace = true, features = ["serde_json"], optional = true }
[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["test-util", "macros", "rt-multi-thread", "time"] }
reqwest = { workspace = true, features = ["json", "stream"] }
futures-util = { workspace = true }