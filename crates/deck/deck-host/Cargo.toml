[package]
name = "deck-host"
version = "0.1.0"
edition = "2024"
publish = false
description = "SAIL framework core — view resolution, compilation, SSR, asset manifests. No HTTP, no server runtime."

[lib]
name = "deck_host"
path = "src/lib.rs"
# Work around the Cargo cdylib/rlib filename collision described in
# crates/deck/deck/Cargo.toml. deck-host has no doctests, so disabling the
# doctest harness avoids the E0463/E0460 collision without losing coverage.
# See claim c-2026-07-19T18-12-45-685Z-f499ce4b.
doctest = false

[features]
default = []
specta = ["dep:specta"]

[dependencies]
sail-compiler = { path = "../../sail/compiler" }

serde = { workspace = true }
serde_json = { workspace = true }
specta = { workspace = true, features = ["serde_json"], optional = true }
tempfile = "3"

[dev-dependencies]
tempfile = "3"
filetime = "0.2"

[lints]
workspace = true
