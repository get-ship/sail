[package]
name = "deck-ssr"
version = "0.1.0"
edition = "2024"
publish = false
description = "Server-render a SYNTHESIZED SUI view (synthetic controller+render) through ship-js — the L0 deno_core/V8 isolate — with route + data resolved over the host-dispatch wire. The production TS-SSR path, ADDITIVE beside the Rust render-eval (it never touches render/eval). Heavy (V8 + Rolldown), so members-only — excluded from default-members like apps/host."

[lib]
path = "src/lib.rs"

[dependencies]
# The synthetic emitter — used as a pure function (no CLI shell-out).
sui-compiler = { path = "../../sui/compiler" }
# ship-js — the org's shared L0 deno_core/V8 isolate (the consistent JS execution
# environment; home for configurable sandboxes / egress / allowed-expression
# policy). Shared org INFRASTRUCTURE, not a ship-PRODUCT coupling. Local path dep
# against the sibling ship checkout: kills the machine-specific `file://` URL AND
# the rev-drift (builds against the current ship-js, not a pinned rev).
# NOTE: a path dep doesn't resolve from a git WORKTREE at a different depth — the
# worktree-robust + smell-free home is a LOCAL CARGO REGISTRY (the Verdaccio-for-
# cargo equivalent: Kellnr / cargo-http-registry), published when ship-js
# stabilizes. ship-js is a clean leaf (crates.io + deno_core only), so that
# publish won't cascade. Tracked as the proper fix.
ship-js = { path = "/home/madvib/dev/Ship/ship-exec/crates/ship-js", features = ["deno"] }
# Deck's request/data contracts (DataPort) the host Dispatch maps onto.
deck-core = { path = "../deck-core" }
# The project's own bundler (Rolldown), so the measured bundle matches the
# real pipeline rather than a hand-rolled toy.
rolldown = "1.0.3"
rolldown_common = "1.0.3"

tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "sync"] }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }

[lints]
workspace = true
