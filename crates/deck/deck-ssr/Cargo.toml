[package]
name = "deck-ssr"
version = "0.1.0"
edition = "2024"
publish = false
description = "Server-render a SYNTHESIZED SUI view (synthetic controller+render) through ship-js — the L0 deno_core/V8 isolate — with route + data resolved over the host-dispatch wire. The production TS-SSR path, ADDITIVE beside the Rust render-eval (it never touches render/eval). Heavy (V8 + Rolldown), so members-only — excluded from default-members like apps/host."

[lib]
path = "src/lib.rs"

[dependencies]
# The synthetic emitter — used as a pure function (no CLI shell-out).
sui-compiler = { path = "../../sui/compiler" }
# The L0 JS engine: the deno_core/V8 isolate + the host-dispatch wire.
# ship-js is Ship's runtime — a cargo-managed, REV-PINNED git dependency, not a
# relative path. A path like `../../../../ship` resolves to a different place
# from a git worktree (different checkout depth), which is what kept biting
# agents; a git dep resolves identically from any worktree. Bump `rev` to adopt
# a newer ship-js. Local file:// URL for now (no SSH-auth dependency); swap to
# `ssh://git@github.com/madvib/Ship.git` (same rev) for cross-machine / CI.
ship-js = { git = "file:///home/madvib/dev/Ship/ship", rev = "82909ba18371d702f3ae83fe7222ec009685f753", features = ["deno"] }
# Deck's request/data contracts (DataPort) the host Dispatch maps onto.
deck-core = { path = "../deck-core" }
# The project's own bundler (Rolldown), so the measured bundle matches the
# real pipeline rather than a hand-rolled toy.
rolldown = "1.0.3"
rolldown_common = "1.0.3"

tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "sync"] }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }

[lints]
workspace = true
