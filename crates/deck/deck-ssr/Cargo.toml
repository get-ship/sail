[package]
name = "deck-ssr"
version = "0.1.0"
edition = "2024"
publish = false
description = "Server-render a SYNTHESIZED SAIL view (synthetic controller+render) through ship-js — the L0 deno_core/V8 isolate — with route + data resolved over the host-dispatch wire. The production TS-SSR path, ADDITIVE beside the Rust render-eval (it never touches render/eval). Heavy (V8 + Rolldown), so members-only — excluded from default-members like apps/host."

[lib]
path = "src/lib.rs"
# Work around the Cargo cdylib/rlib filename collision described in
# crates/deck/deck/Cargo.toml. deck-ssr has no doctests, so disabling the
# doctest harness avoids the E0463/E0460 collision without losing coverage.
# See claim c-2026-07-19T18-12-45-685Z-f499ce4b.
doctest = false

[dependencies]
# The synthetic emitter — used as a pure function (no CLI shell-out).
sail-compiler = { path = "../../sail/compiler" }
# ship-js — L0 deno_core/V8 isolate. Git dep on ship-exec (publish-to-crates.io
# is the long-term home; do NOT vendor a fork into this repo).
ship-js = { git = "https://github.com/get-ship/ship-exec.git", package = "ship-js", features = ["deno"] }
# Deck's request/data contracts (DataPort) the host Dispatch maps onto.
deck-core = { path = "../deck-core" }
# The project's own bundler (Rolldown), so the measured bundle matches the
# real pipeline rather than a hand-rolled toy.
rolldown = "1.0.3"
rolldown_common = "1.0.3"

tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "sync"] }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }

[lints]
workspace = true
