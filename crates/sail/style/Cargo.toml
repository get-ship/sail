[package]
name = "sail-style"
version = "0.1.0"
edition = "2024"
publish = false
description = "Compile-time Style value language: parse, IR, emit, clash, scales, and leaf sx machinery."

[lib]
name = "sail_style"
path = "src/lib.rs"

[[bin]]
name = "sail-style-channels-codemod"
path = "src/bin/channels_codemod.rs"

[[bin]]
name = "sail-style-teaching-codemod"
path = "src/bin/teaching_codemod.rs"

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[lints]
workspace = true
