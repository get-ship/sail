[package]
name = "sail-lsp"
version = "0.1.0"
edition = "2024"
license.workspace = true
description = "Language Server for SUI `.sail` templates — thin LSP shell over sail-compiler."

[[bin]]
name = "sail-lsp"
path = "src/main.rs"

[dependencies]
sail-compiler = { path = "../compiler" }
sail-lint = { path = "../lint" }
lsp-server = "0.7"
lsp-types = "0.95"
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }

[lints]
workspace = true
