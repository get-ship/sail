[package]
name = "spinnaker"
version = "0.1.0"
edition = "2024"
publish = false
description = "Compile-time Style value language: parse, IR, Intent port, clash. CSS realization is the css adapter."

[lib]
name = "spinnaker"
path = "src/lib.rs"

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[lints]
workspace = true


