[package]
name = "sail-compiler-napi"
version = "0.1.0"
edition = "2024"
publish = false
description = "Node-API (.node) binding around `sail-compiler`. In-process compile for the SAIL test harness — one cargo-current build feeds both the daemon and the harness, so there is no second artifact (wasm pkg) to go stale. The browser playground keeps the wasm surface; this crate is the Node path only."

# napi-rs builds a cdylib that the napi CLI renames to a platform `.node`
# addon. `lib` stays so the crate type-checks under plain `cargo build` and
# `cargo test` without the napi CLI in the loop.
[lib]
crate-type = ["cdylib", "lib"]
path = "src/lib.rs"

[dependencies]
# The whole point: depend on the native compiler directly. Same
# `compile(&str, CompileOpts) -> Result<CompileOutput, CompileError>` fn the
# daemon (deck-core/src/view.rs) compiles through, so the harness and
# production share one codegen path and one build identity.
sail-compiler = { path = "../compiler" }
serde = { workspace = true }
serde_json = { workspace = true }

# napi-rs v2/v3. `napi-derive` provides the `#[napi]` attribute; `napi`
# provides the runtime glue and the N-API host bindings. We keep the
# feature surface minimal — no async, no tokio — because the binding is a
# single synchronous string-in/string-out call.
napi = { version = "3", default-features = false, features = ["napi8"] }
napi-derive = "3"

[build-dependencies]
napi-build = "2"

[lints]
workspace = true
